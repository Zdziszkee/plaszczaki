<script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"data": {"id": 10491, "slug": "jaroszowiec-ul-kolejowa-2c", "page_structure": {"structure_rendered": [{"type": "layout100", "children": [{"type": "property_details_snippet", "result": {"main_photo": {"name": "hala1cms", "alt_desc": "", "url": "/api/public/52d64550-9da7-451a-8d04-5a6fdd82ca52.jpg"}, "page_link": "nieruchomosci.pkobp.pl/oferty-nieruchomosci-pko-banku-polskiego/jaroszowiec-ul-kolejowa-2c", "is_active": true, "property_type": "budynki użytkowo-biurowe", "manager": {"photo": null, "uuid": "061115e3-8f69-43cb-bcb3-c9a53a2dd82e", "sex": "female", "first_name": "Agata", "last_name": "Wojtuszek", "email": "agata.wojtuszek@pkobp.pl", "phone": "723 725 134", "job_position": "Ekspert"}, "picture": null, "photos": [{"name": "hala1cms", "alt_desc": "", "url": "/api/public/52d64550-9da7-451a-8d04-5a6fdd82ca52.jpg"}, {"name": "Jaroszowiec_biuro_cms", "alt_desc": "", "url": "/api/public/8e053cf5-dd08-447c-909c-0f22c30a9a8b.jpg"}], "accordions": [{"id": 260, "title": "Przetarg IV/2026", "content": "<p>Powszechna Kasa Oszczędności</p>\n<p>Bank Polski Spółka Akcyjna</p>\n<p>z siedzibą w Warszawie,</p>\n<p>ul. Świętokrzyska 36</p>\n<p>00-116 Warszawa</p>\n<p>dalej również „PKO Bank Polski S.A.”, „Bank”</p>\n<p> </p>\n<p style=\"text-align: center;\"><strong>OGŁASZA PRZETARG PISEMNY NIEOGRANICZONY NR IV/2026 NA SPRZEDAŻ PRAW DO NIERUCHOMOŚCI POŁOŻONEJ W JAROSZOWCU PRZY UL. KOLEJOWEJ 2C</strong></p>\n<p> </p>\n<p>Przedmiotem przetargu pisemnego nieograniczonego nr IV/2026, zwanego dalej „Przetargiem” jest prawo użytkowania wieczystego nieruchomości gruntowej położonej w Jaroszowcu przy ul. Kolejowej stanowiącej działki o numerach ewidencyjnych 35/20 o powierzchni 0,3181 ha oraz 36/2 o powierzchni 0,5955 ha o łącznej powierzchni 0,9136 ha wraz z prawem odrębnej własności posadowionych na ww. nieruchomości budynków:</p>\n<p>- budynku o identyfikatorze 121204_2.0006.202_BUD, rodzaj według Klasyfikacji Środków Trwałych: zbiorniki, silosy i budynki magazynowe („Hala”) o powierzchni 659,13 m<sup>2</sup>;</p>\n<p>- budynku o identyfikatorze 121204_2.0006.273_BUD, rodzaj według Klasyfikacji Środków Trwałych: budynki handlowo- usługowe („Hala produkcyjno-biurowa”) o powierzchni 1 206,25 m<sup>2</sup>;</p>\n<p>- budynku o identyfikatorze 121204_2.0006.354_BUD, rodzaj według Klasyfikacji Środków Trwałych: pozostałe budynki niemieszkalne („Budynek portierni”) o powierzchni 12,31 m<sup>2</sup>;</p>\n<p>- budynku o identyfikatorze 121204_2.0006.413_BUD rodzaj według Klasyfikacji Środków Trwałych: pozostałe budynki niemieszkalne („Budynek stacji transformatorowej”) o powierzchni 40,72 m<sup>2</sup>;</p>\n<p>oraz z przysługującym Bankowi prawem własności znajdujących się na ww. nieruchomości budowli oraz urządzeń trwale z nią związanych.</p>\n<p>Łączna powierzchnia użytkowa budynków wynosi 1 918,41 m<sup>2</sup></p>\n<p> </p>\n<p><strong>LOKALIZACJA NIERUCHOMOŚCI: </strong>nieruchomość położona na obszarze przemysłowym w Jaroszowcu, w otoczeniu dominują liczne zakłady usługowe, przemysłowe i usługowo- przemysłowe.</p>\n<p> </p>", "order": 1, "is_expanded": true, "property": 70}, {"id": 261, "title": "Uwarunkowania planistyczne", "content": "<p><strong>UWARUNKOWANIA PLANISTYCZNE: </strong>zgodnie z miejscowym planem zagospodarowania przestrzennego Gminy Klucze – część A i C, zatwierdzonym Uchwałą nr XXXIV/217/2020 Rady Gminy Klucze z dnia 17.12.2020 r. działki ewidencyjne nr 35/20 oraz nr 36/2 w Jaroszowcu położone są na terenach oznaczonych jako 2P – tereny przemysłowe.</p>", "order": 2, "is_expanded": false, "property": 70}, {"id": 262, "title": "Świadectwo charakterystyki energetycznej", "content": "<p>Dla przedmiotowej nieruchomości zostało wydane Świadectwo charakterystyki energetycznej budynku z dnia 25.03.2025 r. Zgodnie z ww. dokumentem:</p>\n<ol>\n<li>wskaźnik rocznego zapotrzebowania na energię użytkową wynosi: EU = 91,69 kWh/(m<sup>2</sup> rok);</li>\n<li>wskaźnik rocznego zapotrzebowania na energię końcową wynosi: EK = 147,27 kWh/(m<sup>2</sup> rok);</li>\n<li>wskaźnik rocznego zapotrzebowania na nieodnawialną energię pierwotną wynosi: EP = 179,17 kWh/(m<sup>2</sup> rok);</li>\n<li>udział odnawialnych źródeł energii w rocznym zapotrzebowaniu na energię końcową wynosi: Uoze = 0 %;</li>\n<li>jednostkowa wielkość emisji CO<sub>2</sub> wynosi: E<sub>CO2</sub> = 0,0314 t CO<sub>2</sub>/(m<sup>2</sup> rok).</li>\n</ol>", "order": 3, "is_expanded": false, "property": 70}, {"id": 263, "title": "Cena i termin zbierania ofert", "content": "<p><strong>CENA WYWOŁAWCZA </strong>wynosi<strong> </strong>1 839 000 zł (słownie: jeden milion osiemset trzydzieści dziewięć tysięcy złotych)</p>\n<p>W ocenie Banku sprzedaż nieruchomości będzie podlegać zwolnieniu z opodatkowania podatkiem od towarów i usług (VAT) na podstawie art. 43 ust. 1 pkt 10 ustawy z dnia 11 marca 2004 r. o podatku od towarów i usług (dalej „UVAT”). W przypadku wyboru opodatkowania podatkiem VAT, do wskazanej ceny zostanie doliczony podatek VAT według odpowiedniej stawki określonej w obowiązujących przepisach prawa.</p>\n<p><strong>WPŁATA WADIUM </strong>w wysokości<strong> </strong>184 000 zł (słownie: sto osiemdziesiąt cztery tysiące złotych).</p>\n<p><strong>TERMIN ZBIERANIA OFERT  </strong>kończy się dnia 12.01.2027. r. o godz.15:00.</p>\n<p><strong>MIEJSCE SKŁADANIA OFERT: </strong>Powszechna Kasa Oszczędności Bank Polski Spółka Akcyjna, Departament Sprzedaży i Najmu Nieruchomości, ul. Świętokrzyska 36, 00-116 Warszawa.</p>", "order": 4, "is_expanded": true, "property": 70}, {"id": 264, "title": "Informacje dodatkowe", "content": "<p>Informacje o przedmiocie Przetargu oraz o warunkach Przetargu, w tym w zakresie czasu i miejsca Przetargu, dokumentów dotyczących przedmiotu Przetargu, sposobu składania ofert, opisu opodatkowania transakcji sprzedaży nieruchomości, informacji na temat wadium, informacji o możliwości przeprowadzenia drugiego etapu postępowania tj. aukcji elektronicznej, w tym projekt regulaminu aukcji elektronicznej, znajdują się w dokumencie zatytułowanym „Warunki przetargu pisemnego nieograniczonego nr IV/2026 na sprzedaż praw do nieruchomości położonej w Jaroszowcu przy ul. Kolejowej 2C”, zwanym dalej „Warunkami”. Dokument ten (wraz z załącznikami) zostanie wysłany drogą elektroniczną (wiadomość e-mail), po podpisaniu umowy o zachowaniu poufności, na adres poczty elektronicznej (e-mail) wskazany w umowie o zachowaniu poufności. Aby otworzyć pliki z dokumentami, niezbędne jest posiadanie programu umożliwiającego ich rozpakowanie.</p>\n<p><strong>Szczegółowe informacje na temat nieruchomości, można uzyskać:</strong></p>\n<p><strong>a) telefonicznie - u pani Agaty Wojtuszek pod numerem telefonu 723 725 134;</strong></p>\n<p><strong>b) pocztą elektroniczną – wysyłając wiadomość e-mail na adres: agata.wojtuszek@pkobp.pl lub nieruchomosci@pkobp.pl. </strong></p>\n<p> </p>\n<p>Bank zastrzega sobie prawo do zmiany ogłoszenia w sprawie Przetargu, a także Warunków, bez podania przyczyny, w terminie do 5 dni roboczych przed datą zakończenia zbierania ofert określoną w pkt V ppkt 3 Warunków. O zmianach w ogłoszeniu, Bank będzie informował na stronie internetowej Powszechnej Kasy Oszczędności Banku Polskiego S.A., pod adresem: <a href=\"http://www.nieruchomosci.pkobp.pl\">www.nieruchomosci.pkobp.pl</a>, pod nazwą: „Jaroszowiec ul. Kolejowa 2C”. O zmianach w Warunkach, Bank będzie informował wyłącznie osoby, którym uprzednio je udostępnił, poprzez wysłanie wiadomości email na adres e-mail wskazany w umowie o zachowaniu poufności.</p>\n<p> </p>\n<p>Bank zastrzega sobie prawo odwołania Przetargu bez podania przyczyn lub zamknięcia Przetargu bez wybrania oferty na każdym etapie postępowania, w tym aukcji elektronicznej, bez ponoszenia jakichkolwiek skutków prawnych i finansowych, aż do podpisania przedwstępnej umowy sprzedaży Nieruchomości w formie aktu notarialnego lub do podpisania umowy sprzedaży Nieruchomości w formie aktu notarialnego, w przypadku gdy zawarcie umowy sprzedaży Nieruchomości w formie aktu notarialnego nie jest poprzedzone zawarciem przedwstępnej umowy sprzedaży Nieruchomości w formie aktu notarialnego.</p>\n<p> </p>\n<p>Niniejsze ogłoszenie nie stanowi oferty w rozumieniu art. 66 Kodeksu cywilnego.</p>", "order": 5, "is_expanded": false, "property": 70}], "uuid": "e1a19b4e-1e67-4446-8d8f-fbbf6ec67f47", "created": "2026-09-11T15:49:42.298552+02:00", "transaction_type": "sale", "voivodeship": "malopolskie", "price": 1839000, "area": 1918.41, "leasable_area": null, "offer_date_created": "2026-09-11T15:42:57.459000+02:00", "city": "Jaroszowiec", "leaseback": false, "is_archived": false, "street": "Kolejowa", "building_number": "2c", "apartment_number": null, "previous_price": 2102000, "offer_deadline": "2027-01-12T15:00:00+01:00", "lat": 50.3339491, "lng": 19.6020247, "label": null, "href": "", "content": "", "aria_label": "", "link_label": "", "link_external": null, "open_in_new": false, "is_atm": false, "page": 10491, "link_internal": null}}]}]}}}}}</script>
