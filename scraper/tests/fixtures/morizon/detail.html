<!doctype html><html><head><title>Morizon fixture</title></head><body><script type="application/json" data-nuxt-data="nuxt-app" data-ssr="true" id="__NUXT_DATA__">[{"data":1,"serverRendered":204,"path":205},{"property-details-/oferta/sprzedaz-mieszkanie-wielicki-niepolomice-63m2-mzn2048328589-false":2},{"data":3},{"propertyData":4,"breadcrumbs":202},{"advertisementText":5,"area":6,"buildingDetailedInformation":7,"contact":24,"description":32,"detailedInformation":33,"development":98,"developmentDetailedInformation":99,"equipments":100,"facilities":104,"floor":105,"floorFormatted":106,"highlightText":107,"highlightedParameters":108,"headerTitle":125,"id":126,"idOnFrontend":127,"lastModified":128,"refreshedAt":129,"highlightedAt":130,"topAt":131,"location":132,"marketType":148,"numberOfRooms":149,"numberOfRoomsCount":150,"offerDetailedInformation":151,"photos":167,"presentationType":180,"price":181,"priceM2":184,"priceFormatted":187,"priceM2Formatted":188,"reference":189,"status":190,"title":191,"transaction":192,"types":193,"url":198,"servicePromocenaIsActive":199,"omnibusPreviousSalePrice":200,"omnibusPreviousLowestPrice":201},"Komfortowe mieszkanie z ogródkiem","63",[8,12,16,20],{"label":9,"value":10,"url":11},"Typ budynku","Blok","/mieszkania/blok/wielicki/miasto-niepolomice/",{"label":13,"value":14,"url":15},"Materiał budowlany","Zróżnicowany",null,{"label":17,"value":18,"url":19},"Rok budowy","2017",null,{"label":21,"value":22,"url":23},"Ogrzewanie","Gazowe",null,{"company":25,"person":29},{"id":26,"name":27,"type":28},49679,"ap7 group","AGENCY",{"name":30,"type":31},"Krystyna Krawczyk","AGENT","<p>Na sprzedaż nowoczesne, w pełni umeblowane mieszkanie o powierzchni 63 m² położone na parterze. </p><p>Oferowana nieruchomość posiada prywatny ogródek o pow. 70 m² zagospodarowany pergolą oraz strefą wypoczynkową oraz miejsce postojowe w cenie. </p><p>Mieszkanie charakteryzuje się funkcjonalnym układem i dużą ilością naturalnego światła składa się z pokoju dziennego z aneksem kuchennym, sypialni z wyjściem do ogrodu oraz pokoju dziecięcego lub pokoju pełniącego funkcję gabinetu, duża łazienka oraz garderoba. </p><p>Niezależne ogrzewanie gazowe pozwala na swobodę regulowania temperaturą, zastosowana bardzo dobra izolacja termiczna przekłada się na ograniczenie kosztów utrzymania w sezonie zimowym, jak również w okresie letnim zapewnia przyjemny chłód. </p><p>Wnętrza wykończone w jasnych kolorach co optycznie powiększa wnętrza i daje dużo światła naturalnego. </p><p>Mieszkanie idealne dla rodzin, par oraz dla każdego co szuka harmonii i wysokiego standardu życia w otoczeniu zieleni. </p><p>Zieleni, ponieważ mieszkanie zlokalizowane jest blisko Puszczy Niepołomickiej, to raj dla miłośników spacerów, wycieczek rowerowych i aktywnego wypoczynku. </p><p>Mieszkanie nie wymaga dużych nakładów finansowych, zadzwoń i umów się na prezentację . </p><p>- Nasze usługi świadczymy zgodnie z Ustawą z dnia 21 sierpnia 1997 r. o gospodarce nieruchomościami (t.j. Dz. U. z 2024 r. poz. 1145 z późn. zm .), w oparciu o umowę pośrednictwa, która gwarantuje Państwu bezpieczeństwo transakcji oraz pełną opiekę naszego doradcy przez cały okres trwania współpracy. Zgodnie z art. 179b. powołanej wyżej ustawy za wykonaną usługę pobieramy wynagrodzenie zgodnie z warunkami uzgodnionymi w zawartej umowie, którą podpisujemy podczas pierwszego spotkania z Klientem. </p><p>ap7 group oświadcza, iż posiada obowiązkowe ubezpieczenie od odpowiedzialności cywilnej podmiotów uczestniczących w gospodarce nieruchomościami (polisa PZU S.A. nr<span class=\"replacePhone\"><span class=\"replacePhone\"><span class=\"replacePhone\">1<span class=\"replacePhone\">104565395</span>6</span></span></span>).</p><p>Ogłoszenie nie stanowi oferty handlowej w rozumieniu art. 66 kodeksu cywilnego.</p>",[34,38,42,46,50,54,58,62,66,70,74,78,82,86,90,94],{"label":35,"value":36,"url":37},"Pow. całkowita","63 m²",null,{"label":39,"value":40,"url":41},"Wysokość wnętrza","250 cm",null,{"label":43,
