rzedaż przestronne mieszkanie o powierzchni 85,4 m², zlokalizowane w klimatycznej kamienicy w okolicy ulic Skawińskiej i Augustiańskiej, w jednej z najbardziej cenionych części Krakowa – na Kazimierzu.</p><p>Lokal usytuowany jest na trzecim piętrze, od strony pięknej, zielonej oficyny, co zapewnia przyjemny widok oraz kameralną atmosferę.</p><p>Mieszkanie składa się z czterech pokoi, kuchni, łazienki oraz korytarza. Wysokie sufity nadają wnętrzu wyjątkowego charakteru i potęgują poczucie przestrzeni. Dodatkowym atutem jest podwójna ekspozycja, dzięki której mieszkanie jest dobrze doświetlone.</p><p>Stan mieszkania: Mieszkanie wymaga odświeżenia, co daje przyszłemu właścicielowi możliwość dostosowania wnętrza do własnych potrzeb i gustu. Duży metraż, funkcjonalny układ pomieszczeń oraz wysokie sufity stwarzają szerokie możliwości aranżacyjne.</p><p>Dodatkowym atutem nieruchomości jest ogrzewanie miejskie, zapewniające wygodę użytkowania.</p><p>Opłaty: Czynsz administracyjny wynosi około 750 zł miesięcznie. Dodatkowo płatny jest prąd według zużycia.</p><p>Cena: 1 450 000 zł – do negocjacji</p><p>Lokalizacja: Nieruchomość znajduje się w wyjątkowej części krakowskiego Kazimierza, w okolicy ulic Skawińskiej i Augustiańskiej. Jest to lokalizacja łącząca niepowtarzalny klimat historycznej dzielnicy z wygodą codziennego życia.</p><p>W najbliższej okolicy znajdują się liczne restauracje, kawiarnie, sklepy oraz punkty usługowe. Bliskość terenów spacerowych i Bulwarów Wiślanych, a także dogodny dostęp do komunikacji miejskiej sprawiają, że jest to doskonałe miejsce zarówno do zamieszkania, jak i pod inwestycję.</p><p>Zapraszamy do kontaktu i umówienia prezentacji!</p><p>Kontakt:</p><p>Agencja Nieruchomości Tecnocasa</p><p>Oddział I: Kazimierz, Stare Miasto, Stare Grzegórzki</p><p>ul. Starowiślna 33</p><p><span class=\"replacePhone\">512 110 804</span></p><p>Szanowni Państwo, jest to oferta na wyłączność w naszym biurze – więcej informacji pod numerem telefonu podanym powyżej.
