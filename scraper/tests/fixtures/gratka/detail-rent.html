<!doctype html><html><head><title>Gratka fixture</title></head><body><script type="application/json" data-nuxt-data="nuxt-app" data-ssr="true" id="__NUXT_DATA__">[{"data":1,"serverRendered":196,"path":197},{"property-details-/nieruchomosci/mieszkanie-krakow-pradnik-bialy-pradnicka/ob/49808403-false":2},{"data":3},{"propertyData":4,"breadcrumbs":194},{"advertisementText":5,"area":6,"buildingDetailedInformation":7,"contact":24,"description":32,"detailedInformation":33,"development":90,"developmentDetailedInformation":91,"equipments":92,"facilities":96,"floor":100,"floorFormatted":101,"highlightText":102,"highlightedParameters":103,"headerTitle":120,"id":121,"idOnFrontend":122,"lastModified":123,"refreshedAt":124,"highlightedAt":125,"topAt":126,"location":127,"marketType":143,"numberOfRooms":144,"numberOfRoomsCount":145,"offerDetailedInformation":146,"photos":159,"presentationType":172,"price":173,"priceM2":176,"priceFormatted":179,"priceM2Formatted":180,"reference":181,"status":182,"title":183,"transaction":184,"types":185,"url":190,"servicePromocenaIsActive":191,"omnibusPreviousSalePrice":192,"omnibusPreviousLowestPrice":193},"Krowodrza Górka - kawalerka z balkonem na wynajem","24",[8,12,16,20],{"label":9,"value":10,"url":11},"Typ budynku","Blok",null,{"label":13,"value":14,"url":15},"Materiał budowlany","Wielka płyta",null,{"label":17,"value":18,"url":19},"Rok budowy","1980",null,{"label":21,"value":22,"url":23},"Ogrzewanie","Miejskie",null,{"company":25,"person":29},{"id":26,"name":27,"type":28},412129,"Centrum Doradców Nieruchomości","AGENCY",{"name":30,"type":31},"Barbara Szarek","AGENT","<p>Wynajmiemy pracującej osobie lub parze, odnowione, słoneczne jednopokojowe mieszkanie, położone na VII p. w bloku z lat 80-tych. Ul. Prądnicka (najbliższy przystanek tramwajowy Bratysławska - 2min) </p><p>Spory ustawny pokój z wyjściem na balkon, łazienka razem z wc, aneks kuchenny w przedpokoju. </p><p>Mieszkanie jest umeblowane i wyposażone. </p><p>W pokoju rozkładana wygodna kanapa, szafa dwudrzwiowa, komoda, stolik z krzesłami, stolik kawowy. </p><p>Kuchnia z meblami na wymiar, jest kuchenka z piekarnikiem. We wnęce duża lodówka z zamrażarką. </p><p>W przedpokoju wieszak, lustro, szafka na buty. </p><p>Koszty: czynsz dla właściciela 1600 zł + czynsz administracyjny 372 zł (na 1 os.) + prąd i gaz (łącznie, miesięcznie ok 100-120 zł). </p><p>W czynszu wliczona ciepła woda miejska - zdjęcia zostały zrobione przed jej podłączeniem (aktualnie brak bojlera) </p><p>Kaucja 2000 zł, biuro pobiera prowizję w wysokości 1-miesięcznego czynszu. Konieczna umowa najmu okazjonalnego. </p><p>Lokalizacja bardzo wygodna, blisko do przystanku tramwajowego i autobusowego (Bratysławska), zaraz obok bloku Kaufland, drogeria, zieleniak, pętla Krowodrza Górka. </p><p>Szczegóły telefonicznie </p><p><span class=\"replacePhone\">734 406 686 </span></p><p>Barbara Szarek</p><p>Pośrednik odpowiedzialny zawodowo za wykonanie umowy pośrednictwa: Katarzyna Szarek (licencja nr: 546)</p>",[34,38,42,46,50,54,58,62,66,70,74,78,82,86],{"label":35,"value":36,"url":37},"Stan nieruchomości","Bardzo dobry",null,{"label":39,"value":40,"url":41},"Pow. całkowita","24 m²",null,{"label":43,"value":44,"url":45},"Piętro","7/10",null,{"label":47,"value":48,"url":49},"Liczba pięter","10",null,{"label":51,"value":52,"url":53},"Liczba sypialni","1",null,{"label":55,"value":56,"url":57},"Typ kuchni","Aneks",null,{"label":59,"value":60,"url":61},"łazienka razem z WC","Tak",null,{"label":63,"value":64,"url":65},"Balkon","Tak",null,{"label":67,"value":68,"url":69},"Stolarka okienna","PCV",null,{"label":71,"value":72,"url":73},"Depozyt za wynajem","2000,00",null,{"label":75,"value":76,"url":77},"Dodatkowe koszty","372,00",null,{"label":79,"value":80,"url":81},"Rynek","Wtórny",null,{"label":83,"value":84,"url":85},"Forma własności","Własność",null,{"label":87,"value":88,"url":89},"Liczba pokoi","1","/nieruchomosci/mieszkania/kawalerki/krakow/os-pradnik-bialy/wynajem",null,[],[93],{"icon":94,
